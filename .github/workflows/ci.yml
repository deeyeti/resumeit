name: CI — Lint & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # No npm cache — this is a zero-dependency static app

      - name: Check required files exist
        run: |
          files=("index.html" "style.css" "app.js" "modules/vault.js" "modules/github.js" "modules/llm.js" "modules/parser.js" "modules/exporter.js" "README.md" "LICENSE")
          all_ok=true
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING: $f"
              all_ok=false
            fi
          done
          $all_ok || exit 1

      - name: Syntax-check all JavaScript modules
        run: |
          node --check app.js           && echo "✅ app.js"
          node --check modules/vault.js    && echo "✅ vault.js"
          node --check modules/github.js   && echo "✅ github.js"
          node --check modules/llm.js      && echo "✅ llm.js"
          node --check modules/parser.js   && echo "✅ parser.js"
          node --check modules/exporter.js && echo "✅ exporter.js"

      - name: Check for leftover debug statements
        run: |
          echo "Scanning for console.log..."
          if grep -rn "console\.log" app.js modules/; then
            echo "⚠️  console.log found — consider removing before release"
          else
            echo "✅ No console.log found"
          fi

      - name: Guard against accidental large files
        run: |
          for f in index.html style.css app.js modules/*.js; do
            size=$(wc -c < "$f")
            if [ "$size" -gt 500000 ]; then
              echo "❌ $f is too large (${size} bytes)"
              exit 1
            fi
            echo "✅ $f — ${size} bytes"
          done

  lint-html:
    name: Lint HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Validate index.html
        run: |
          htmlhint index.html \
            --rules 'doctype-first:true,title-require:true,attr-lowercase:true,tag-pair:true,id-unique:true' \
          && echo "✅ HTML valid" || echo "⚠️  HTML hints found (non-blocking)"
