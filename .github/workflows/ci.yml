name: CI — Lint & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dev dependencies
        run: |
          npm init -y
          npm install --save-dev eslint htmlhint

      - name: Lint JavaScript files
        run: |
          npx eslint app.js modules/*.js \
            --rule '{"no-undef": "warn", "no-unused-vars": "warn"}' \
            --env browser,es2022 \
            --parser-options 'ecmaVersion:2022,sourceType:module' \
            --format stylish || true

      - name: Validate HTML
        run: |
          npx htmlhint index.html \
            --rules '{"doctype-first":true,"title-require":true,"attr-lowercase":true,"tag-pair":true}' \
            || true

      - name: Check for console.log statements (warn only)
        run: |
          echo "Checking for leftover console.log statements..."
          grep -rn "console\.log" app.js modules/ && echo "⚠️  Found console.log statements" || echo "✅ No console.log found"

  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=("index.html" "style.css" "app.js" "modules/vault.js" "modules/github.js" "modules/llm.js" "modules/parser.js" "modules/exporter.js" "README.md" "LICENSE")
          all_ok=true
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING: $f"
              all_ok=false
            fi
          done
          $all_ok || exit 1

      - name: Check JS module syntax
        run: |
          node --check app.js && echo "✅ app.js syntax OK"
          node --check modules/vault.js && echo "✅ vault.js syntax OK"
          node --check modules/github.js && echo "✅ github.js syntax OK"
          node --check modules/llm.js && echo "✅ llm.js syntax OK"
          node --check modules/parser.js && echo "✅ parser.js syntax OK"
          node --check modules/exporter.js && echo "✅ exporter.js syntax OK"

      - name: Check file sizes (guard against accidental large files)
        run: |
          for f in index.html style.css app.js modules/*.js; do
            size=$(wc -c < "$f")
            if [ "$size" -gt 500000 ]; then
              echo "❌ $f is too large (${size} bytes)"
              exit 1
            fi
            echo "✅ $f — ${size} bytes"
          done
