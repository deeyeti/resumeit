name: CD — Deploy to GitHub Pages

on:
  push:
    branches: [main]      # Auto-deploy on every push to main
  release:
    types: [published]    # Also deploy when a release is published
  workflow_dispatch:      # Allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false  # Don’t cancel mid-deploy — finish then start fresh

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject version into app
        run: |
          VERSION=$(git describe --tags --always --abbrev=7 2>/dev/null || echo "dev")
          DISPLAY_VERSION="${VERSION#v}"
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Injecting version: $VERSION at $DEPLOY_TIME"
          # Replace version placeholder in index.html if present
          sed -i "s/v1\.1 · Open Source/v${DISPLAY_VERSION} · Open Source/g" index.html || true
          # Write a version.json file for the auto-update checker
          cat > version.json << EOF
          {
            "version": "${VERSION}",
            "deployedAt": "${DEPLOY_TIME}",
            "commit": "${GITHUB_SHA}"
          }
          EOF
          echo "Generated version.json:"
          cat version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Automatically enables GitHub Pages if not already on

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # Deploy entire project root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
